name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    tests:
        name: PHP ${{ matrix.php }} - ${{ matrix.database }} - ${{ matrix.dependencies }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                database: [sqlite]
                dependencies: [highest]
                include:
                    - { php: '8.3', database: sqlite, dependencies: lowest }
                    - { php: '8.5', database: mysql, port: 3306, username: root, dependencies: highest }
                    - { php: '8.5', database: mariadb, port: 3307, username: root, dependencies: highest }
                    - { php: '8.5', database: pgsql, port: 5432, username: postgres, dependencies: highest }
        services:
            mysql:
                image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: test
                ports: ['3306:3306']
                options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10
            mariadb:
                image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: test
                ports: ['3307:3306']
                options: --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-timeout=5s --health-retries=10
            postgres:
                image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
                env:
                    POSTGRES_PASSWORD: root
                    POSTGRES_DB: test
                ports: ['5432:5432']
                options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=10
        steps:
            -   uses: actions/checkout@v4
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    coverage: none
            -   uses: ramsey/composer-install@v3
                with:
                    dependency-versions: ${{ matrix.dependencies }}
            -   run: vendor/bin/phpunit
                env:
                    DB_CONNECTION: ${{ matrix.database }}
                    DB_PORT: ${{ matrix.port }}
                    DB_USERNAME: ${{ matrix.username }}
                    DB_PASSWORD: root

    phpstan:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    coverage: none
            -   uses: ramsey/composer-install@v3
            -   run: vendor/bin/phpstan analyse --no-progress
